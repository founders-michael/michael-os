included:
  - MichaelOS
  - MichaelOSUITests
  - Packages
excluded:
  - Packages/.build

# swift-format owns layout and import order; these rules would fight it.
disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment_on_call

opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 140
  ignores_comments: false

identifier_name:
  # Short names here are the token names from tokens.json.
  excluded: [x, y, id, url, ai, bg, xs, sm, md, lg, xl]

type_body_length:
  warning: 300

file_length:
  warning: 400

custom_rules:
  no_todo_without_issue:
    name: TODO needs an owner and an issue
    regex: '//\s*(TODO|FIXME)(?!\(\w+, #\d+\))'
    message: "Write TODO(owner, #issue) or remove it."
    severity: error
  no_hex_colour_outside_tokens:
    name: Colours come from tokens
    included: '^(?!.*DesignSystem/(Sources/Tokens|Tests)/).*\.swift$'
    regex: '(RGBA\(|Color\(red:|UIColor\(red:|#colorLiteral)'
    message: "Use Color.michael.* from DesignSystem."
    severity: error
  feature_imports_feature_or_network:
    name: Features depend on Repositories, Models and DesignSystem only
    included: '.*/Packages/Features/.*\.swift$'
    regex: '^\s*(@testable\s+)?import\s+(\w+Feature|Networking|Auth|TestSupport)\b'
    message: "A feature never imports another feature, Networking, Auth or TestSupport. See architecture-ios.md."
    severity: error
  core_imports_feature:
    name: Core modules never import a feature
    included: '.*/Packages/(Models|Networking|Auth|Repositories|DesignSystem|TestSupport)/.*\.swift$'
    regex: '^\s*(@testable\s+)?import\s+\w+Feature\b'
    message: "Core modules sit below features and never import one."
    severity: error
