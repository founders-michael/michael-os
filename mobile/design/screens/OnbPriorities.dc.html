<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, priorities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button,.m input{font:inherit}
.m input::placeholder{color:var(--faint)}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--solid:#0C1117;--raise:rgba(255,255,255,.05);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--accent:#41F0B0;--accent2:#5CD6FF;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D;--chip:rgba(65,240,176,.10);--chipb:rgba(65,240,176,.28);--track:rgba(255,255,255,.07)}
.m-light{--paint:#F5F7FA;--solid:#FFFFFF;--raise:#F2F5F8;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--accent:#10B981;--accent2:#3B82F6;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF;--chip:#ECFDF5;--chipb:#A7F3D0;--track:#E8EDF2}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 20px 20px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<button aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="4" style="flex: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden"><div style="width: 80%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2))"></div></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: var(--muted)">4 / 5</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1">What matters most right now?</h1>
<p style="margin: 0; font-size: 15px; color: var(--muted)">Up to three. Michael weighs these when two things compete for the same hour.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px">
<sc-for list="{{picked}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--chip); border: 1px solid var(--chipb)">
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; color: var(--atext)">{{p.rank}}</span>
<span style="flex: 1; font-size: 16px; font-weight: 500">{{p.label}}</span>
<button aria-label="{{p.removeLabel}}" onClick="{{p.remove}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="own" style="font-size: 13px; font-weight: 500; color: var(--muted)">Add your own</label>
<input id="own" type="text" maxlength="100" placeholder="For example: finish my degree" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-size: 16px">
</div>
</div>

<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 500; color: var(--muted)">{{hint}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{suggestions}}" as="s" hint-placeholder-count="5">
<button onClick="{{s.add}}" disabled="{{s.disabled}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button style="height: 52px; border-radius: 14px; border: 0; background: var(--fill); color: var(--onfill); font-weight: 600; font-size: 16px; cursor: pointer">Continue</button>
<button style="height: 48px; border: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: 15px; cursor: pointer">Skip for now</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chosen = (this.state || {}).chosen || ['Ship the mobile apps', 'Health'];
const full = chosen.length >= 3;
const picked = chosen.map((label, i) => ({ label, rank: String(i + 1), removeLabel: 'Remove ' + label, remove: () => this.setState({ chosen: chosen.filter((c) => c !== label) }) }));
const suggestions = ['Health', 'Family', 'Career', 'Learning', 'Money', 'Friends'].filter((l) => !chosen.includes(l)).map((label) => ({
label, disabled: full, add: () => { if (!full) this.setState({ chosen: [...chosen, label] }); },
style: 'height:44px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--border2);background:var(--raise);color:' + (full ? 'var(--faint)' : 'var(--text)') + ';cursor:' + (full ? 'default' : 'pointer')
}));
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark', picked, suggestions, hint: full ? 'Three chosen. Remove one to change it.' : 'Or pick from these' };
}
}
</script>
</body>
</html>
