<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button{font:inherit}
.m a{color:inherit;text-decoration:none}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--surface:rgba(255,255,255,.028);--solid:#0C1117;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D;--danger:#FF8A94;--dangerbg:rgba(255,138,148,.10);--shadow:none}
.m-light{--paint:#F5F7FA;--surface:#FFFFFF;--solid:#FFFFFF;--raise:#F2F5F8;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF;--danger:#B42335;--dangerbg:#FFF1F2;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 16px 16px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Tasks.dc.html" style="height: 44px; margin-left: -8px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Tasks</a>
<a href="TaskEditor.dc.html" style="height: 44px; padding: 0 8px; display: inline-flex; align-items: center; color: var(--atext); font-size: 15px; font-weight: 600">Edit</a>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<div style="display: flex; gap: 6px">
<span style="height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: var(--dangerbg); color: var(--danger); font-size: 12px; font-weight: 500">Overdue, 14 Nov</span>
<span style="height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: var(--raise); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 500">High priority</span>
</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.03em; line-height: 1.12">Send the investor update</h1>
<p style="margin: 0; font-size: 15px; color: var(--muted)">Cover runway, the waitlist numbers and the mobile plan. Keep it to one screen.</p>
</div>

<fieldset style="border: 0; padding: 0; margin: 20px 0 0">
<legend style="font-size: 13px; font-weight: 500; color: var(--muted); padding: 0; margin-bottom: 8px">Status</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: var(--raise); border: 1px solid var(--border)">
<sc-for list="{{statuses}}" as="s" hint-placeholder-count="3">
<button aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</fieldset>

<dl style="margin: 16px 0 0; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-bottom: 1px solid var(--border)"><dt style="font-size: 15px; color: var(--muted)">Due</dt><dd style="margin: 0; font-size: 15px; font-weight: 500">Sat 14 Nov 2026</dd></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-bottom: 1px solid var(--border)"><dt style="font-size: 15px; color: var(--muted)">Estimate</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">45 min</dd></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px"><dt style="font-size: 15px; color: var(--muted)">Remaining</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">45 min</dd></div>
</dl>

<h2 style="margin: 20px 4px 8px; font-size: 17px; font-weight: 600; letter-spacing: -.02em">Planned sessions</h2>
<div style="border-radius: 18px; border: 1px dashed var(--border2); padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<span style="font-size: 14px; color: var(--muted)">No time is set aside for this yet.</span>
<a href="Calendar.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--raise); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center">Find a time</a>
</div>

<div style="flex: 1"></div>
<button style="height: 48px; border-radius: 12px; border: 0; background: transparent; color: var(--danger); font-size: 15px; font-weight: 600; cursor: pointer">Delete task</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const current = (this.state || {}).status || 'To do';
const statuses = ['To do', 'In progress', 'Done'].map((label) => ({
label, pressed: label === current ? 'true' : 'false',
pick: () => this.setState({ status: label }),
style: 'height:40px;border:0;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;' + (label === current ? 'background:var(--solid);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)' : 'background:transparent;color:var(--muted)')
}));
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark', statuses };
}
}
</script>
</body>
</html>
