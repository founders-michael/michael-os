<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, work days and hours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button{font:inherit}
.m a{color:inherit;text-decoration:none}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--solid:#0C1117;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--accent:#41F0B0;--accent2:#5CD6FF;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D;--track:rgba(255,255,255,.07)}
.m-light{--paint:#F5F7FA;--solid:#FFFFFF;--raise:#F2F5F8;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--accent:#10B981;--accent2:#3B82F6;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF;--track:#E8EDF2}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 20px 20px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<button aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3" style="flex: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden"><div style="width: 60%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2))"></div></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: var(--muted)">3 / 5</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1">When do you work?</h1>
<p style="margin: 0; font-size: 15px; color: var(--muted)">Michael keeps focus sessions inside these hours. Skip this if your days don't follow a pattern.</p>
</div>

<fieldset style="border: 0; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; font-weight: 500; color: var(--muted); padding: 0; margin-bottom: 10px">Work days</legend>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" onClick="{{d.toggle}}" style="{{d.style}}">{{d.short}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="l-start" style="font-size: 13px; font-weight: 500; color: var(--muted)">Start</span>
<button aria-labelledby="l-start" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 600; text-align: left; cursor: pointer">09:30</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="l-end" style="font-size: 13px; font-weight: 500; color: var(--muted)">End</span>
<button aria-labelledby="l-end" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 600; text-align: left; cursor: pointer">18:30</button>
</div>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: var(--muted)">Time zone: Asia/Kolkata, from this phone. <a href="#zone" style="color: var(--atext); font-weight: 600; display: inline-block; padding: 8px 0">Change</a></p>

<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button style="height: 52px; border-radius: 14px; border: 0; background: var(--fill); color: var(--onfill); font-weight: 600; font-size: 16px; cursor: pointer">Continue</button>
<button style="height: 48px; border: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: 15px; cursor: pointer">I don't have fixed hours</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = (this.state || {}).on || { 0: true, 1: true, 2: true, 3: true, 4: true };
const names = [['M', 'Monday'], ['T', 'Tuesday'], ['W', 'Wednesday'], ['T', 'Thursday'], ['F', 'Friday'], ['S', 'Saturday'], ['S', 'Sunday']];
const days = names.map(([short, full], i) => ({
short, full, pressed: on[i] ? 'true' : 'false',
toggle: () => this.setState({ on: { ...on, [i]: !on[i] } }),
style: 'height:48px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid ' + (on[i] ? 'transparent' : 'var(--border2)') + ';background:' + (on[i] ? 'var(--fill)' : 'transparent') + ';color:' + (on[i] ? 'var(--onfill)' : 'var(--muted)')
}));
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark', days };
}
}
</script>
</body>
</html>
