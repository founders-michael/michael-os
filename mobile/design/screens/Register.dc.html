<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button,.m input{font:inherit}
.m a{color:inherit}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--solid:#0C1117;--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--accent:#41F0B0;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D}
.m-light{--paint:#F5F7FA;--solid:#FFFFFF;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--accent:#10B981;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 20px 20px">
<a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; color: var(--muted)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08">Create your account</h1>
<p style="margin: 0; font-size: 15px; color: var(--muted)">We'll email you a link to confirm the address before you sign in.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-size: 13px; font-weight: 500; color: var(--muted)">Full name</label>
<input id="name" type="text" autocomplete="name" value="Gautam Kumar" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; font-weight: 500; color: var(--muted)">Email</label>
<input id="email" type="email" autocomplete="username" value="gautam@example.com" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="password" style="font-size: 13px; font-weight: 500; color: var(--muted)">Password</label>
<input id="password" type="password" autocomplete="new-password" value="Sample1234" aria-describedby="rules" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--accent); background: var(--solid); color: var(--text); font-size: 16px">
<ul id="rules" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<li style="display: flex; align-items: center; gap: 8px; color: var(--muted)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle></svg>At least 12 characters (10 so far)</li>
<li style="display: flex; align-items: center; gap: 8px; color: var(--atext)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>An uppercase letter</li>
<li style="display: flex; align-items: center; gap: 8px; color: var(--atext)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>A lowercase letter</li>
</ul>
</div>
<button type="submit" disabled style="height: 52px; margin-top: 4px; border-radius: 14px; border: 1px solid var(--border2); background: transparent; color: var(--faint); font-weight: 600; font-size: 16px">Create account</button>
</form>

<div style="flex: 1"></div>
<p style="margin: 0; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5">By creating an account you agree to the <a href="#terms" style="text-decoration: underline">Terms of Service</a> and <a href="#privacy" style="text-decoration: underline">Privacy Policy</a>.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark' };
}
}
</script>
</body>
</html>
