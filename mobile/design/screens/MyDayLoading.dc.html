<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Day, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m a{color:inherit;text-decoration:none}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--bar:#0A0E13;--surface:rgba(255,255,255,.028);--border:rgba(255,255,255,.08);--text:#ECF2F5;--faint:#808D99;--atext:#6AF5C4;--sk:rgba(255,255,255,.07);--orb:radial-gradient(circle at 34% 28%,#E6FFF5 0%,#7DFAD0 16%,#41F0B0 34%,#0F9E76 58%,#04261D 86%);--orbglow:0 0 22px rgba(65,240,176,.5)}
.m-light{--paint:#F5F7FA;--bar:#FFFFFF;--surface:#FFFFFF;--border:#E3E8EE;--text:#0B1220;--faint:#5F6B7B;--atext:#047857;--sk:#E3E8EE;--orb:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#C9F7E4 22%,#34D399 52%,#047857 92%);--orbglow:0 8px 20px rgba(16,185,129,.28)}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.45}}
.m .sk{background:var(--sk);border-radius:8px;animation:shimmer 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.m .sk{animation:none}}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden">
<main aria-busy="true" aria-label="Loading your day" style="flex: 1; min-height: 0; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px"><span class="sk" style="width: 140px; height: 12px"></span><span class="sk" style="width: 240px; height: 30px"></span></div>
<span class="sk" style="width: 44px; height: 44px; border-radius: 50%"></span>
</div>
<div style="border: 1px solid var(--border); border-radius: 20px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span class="sk" style="width: 120px; height: 14px"></span>
<span class="sk" style="width: 100%; height: 14px"></span>
<span class="sk" style="width: 70%; height: 14px"></span>
<span class="sk" style="width: 130px; height: 44px; border-radius: 12px"></span>
</div>
<div style="border: 1px solid var(--border); border-radius: 18px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between"><span class="sk" style="width: 60px; height: 14px"></span><span class="sk" style="width: 90px; height: 14px"></span></div>
<span class="sk" style="width: 100%; height: 8px; border-radius: 999px"></span>
<span class="sk" style="width: 200px; height: 13px"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="sk" style="width: 70px; height: 18px; margin: 7px 0"></span>
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border)"><span class="sk" style="width: 24px; height: 24px; border-radius: 50%"></span><span class="sk" style="flex: 1; height: 14px"></span><span class="sk" style="width: 64px; height: 26px; border-radius: 999px"></span></div>
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border)"><span class="sk" style="width: 24px; height: 24px; border-radius: 50%"></span><span class="sk" style="width: 190px; height: 14px"></span><span style="flex: 1"></span><span class="sk" style="width: 52px; height: 26px; border-radius: 999px"></span></div>
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border)"><span class="sk" style="width: 24px; height: 24px; border-radius: 50%"></span><span class="sk" style="width: 140px; height: 14px"></span><span style="flex: 1"></span><span class="sk" style="width: 52px; height: 26px; border-radius: 999px"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="sk" style="width: 70px; height: 18px; margin: 7px 0"></span>
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border)"><span class="sk" style="width: 24px; height: 24px; border-radius: 50%"></span><span class="sk" style="width: 150px; height: 14px"></span><span style="flex: 1"></span><span class="sk" style="width: 56px; height: 12px"></span></div>
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border)"><span class="sk" style="width: 24px; height: 24px; border-radius: 50%"></span><span class="sk" style="width: 120px; height: 14px"></span><span style="flex: 1"></span><span class="sk" style="width: 48px; height: 12px"></span></div>
</div>
</main>

<nav aria-label="Tabs" style="height: 64px; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border-top: 1px solid var(--border); background: var(--bar)">
<a href="Main.dc.html" aria-current="page" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--atext)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>My Day</a>
<a href="Tasks.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Tasks</a>
<a href="Michael.dc.html" aria-label="Michael" style="height: 64px; display: grid; place-items: center"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: var(--orb); box-shadow: var(--orbglow)"></span></a>
<a href="Calendar.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Calendar</a>
<a href="More.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark' };
}
}
</script>
</body>
</html>
