<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button,.m input{font:inherit}
.m a{color:inherit;text-decoration:none}
.m input::placeholder{color:var(--faint)}
.m-dark{--bg:#06080B;--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),radial-gradient(420px 280px at 0% -4%,rgba(92,214,255,.08),transparent 62%),#06080B;--bar:#0A0E13;--surface:rgba(255,255,255,.028);--solid:#0C1117;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--accent:#41F0B0;--accent2:#5CD6FF;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D;--chip:rgba(65,240,176,.10);--chipb:rgba(65,240,176,.28);--warn:#FFC27A;--warnbg:rgba(255,194,122,.10);--danger:#FF8A94;--dangerbg:rgba(255,138,148,.10);--track:rgba(255,255,255,.07);--ai:linear-gradient(#0B1016,#0B1016) padding-box,linear-gradient(110deg,rgba(65,240,176,.75),rgba(92,214,255,.25) 30%,rgba(255,255,255,.06) 50%,rgba(92,214,255,.25) 70%,rgba(65,240,176,.75)) border-box;--orb:radial-gradient(circle at 34% 28%,#E6FFF5 0%,#7DFAD0 16%,#41F0B0 34%,#0F9E76 58%,#04261D 86%);--orbglow:0 0 22px rgba(65,240,176,.5);--shadow:none}
.m-light{--bg:#F5F7FA;--paint:#F5F7FA;--bar:#FFFFFF;--surface:#FFFFFF;--solid:#FFFFFF;--raise:#F2F5F8;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--accent:#10B981;--accent2:#3B82F6;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF;--chip:#ECFDF5;--chipb:#A7F3D0;--warn:#9A5B00;--warnbg:#FFF7E8;--danger:#B42335;--dangerbg:#FFF1F2;--track:#E8EDF2;--ai:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,#6EE7B7,#BFDBFE 45%,#E3E8EE 60%,#6EE7B7) border-box;--orb:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#C9F7E4 22%,#34D399 52%,#047857 92%);--orbglow:0 8px 20px rgba(16,185,129,.28);--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden">
<main style="flex: 1; min-height: 0; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08">Tasks</h1>
<a href="TaskEditor.dc.html" aria-label="New task" style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--fill); color: var(--onfill)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>

<div style="border: 1px solid transparent; border-radius: 16px; background: var(--ai); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; height: 52px">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: var(--orb); flex: none"></span>
<label for="capture" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Describe a task for Michael to draft</label>
<input id="capture" type="text" placeholder="Call the bank on Friday, 20 minutes" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: var(--text); font-size: 15px; outline: none">
<button aria-label="Draft this task" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--raise); color: var(--text); display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>

<div role="tablist" aria-label="Filter" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: var(--raise); border: 1px solid var(--border)">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted)">
<span>{{countLabel}}</span>
<button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>Due date</button>
</div>

<div style="display: flex; flex-direction: column; margin-top: -10px">
<sc-for list="{{tasks}}" as="task" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid var(--border)">
<button aria-label="{{task.checkLabel}}" onClick="{{task.toggle}}" style="width: 44px; height: 44px; margin-left: -10px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; flex: none; cursor: pointer"><span style="{{task.checkStyle}}"><sc-if value="{{task.done}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#03140D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="{{task.titleStyle}}">{{task.title}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)"><span style="{{task.dueStyle}}">{{task.due}}</span><span aria-hidden="true">·</span><span>{{task.priority}}</span><span aria-hidden="true">·</span><span style="font-family: 'Geist Mono', monospace">{{task.estimate}}</span></span>
</div>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</div>
</sc-for>
</div>
</main>

<nav aria-label="Tabs" style="height: 64px; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border-top: 1px solid var(--border); background: var(--bar)">
<a href="Main.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>My Day</a>
<a href="Tasks.dc.html" aria-current="page" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--atext)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Tasks</a>
<a href="Michael.dc.html" aria-label="Michael" style="height: 64px; display: grid; place-items: center"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: var(--orb); box-shadow: var(--orbglow)"></span></a>
<a href="Calendar.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Calendar</a>
<a href="More.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'dark';
const state = this.state || {};
const filter = state.filter || 'Pending';
const done = state.done || {};
const all = [
{ id: 'a', title: 'Send the investor update', due: 'Overdue, 14 Nov', overdue: true, priority: 'High', estimate: '45 min' },
{ id: 'b', title: 'Renew the domain', due: 'Overdue, 15 Nov', overdue: true, priority: 'Medium', estimate: '10 min' },
{ id: 'c', title: 'Review the auth pull request', due: 'Today', priority: 'High', estimate: '30 min' },
{ id: 'd', title: 'Book the dentist', due: 'Today', priority: 'Low', estimate: '10 min' },
{ id: 'e', title: 'Draft the onboarding copy', due: 'Wed 18 Nov', priority: 'Medium', estimate: '1 h' },
{ id: 'f', title: 'Plan the Android module layout', due: 'Fri 20 Nov', priority: 'Medium', estimate: '2 h' }
];
const visible = all.filter((t) => filter === 'All' || (filter === 'Overdue' ? t.overdue && !done[t.id] : filter === 'Completed' ? done[t.id] : !done[t.id]));
const tasks = visible.map((t) => ({
...t,
done: !!done[t.id],
toggle: () => this.setState({ done: { ...done, [t.id]: !done[t.id] } }),
checkLabel: (done[t.id] ? 'Mark not done: ' : 'Mark done: ') + t.title,
checkStyle: 'width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid ' + (done[t.id] ? 'var(--accent)' : 'var(--border2)') + ';background:' + (done[t.id] ? 'var(--accent)' : 'transparent'),
titleStyle: 'font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + (done[t.id] ? 'color:var(--faint);text-decoration:line-through' : ''),
dueStyle: t.overdue && !done[t.id] ? 'color:var(--danger);font-weight:500' : ''
}));
const filters = ['Pending', 'Overdue', 'Completed', 'All'].map((label) => ({
label,
selected: label === filter ? 'true' : 'false',
pick: () => this.setState({ filter: label }),
style: 'height:36px;border:0;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;' + (label === filter ? 'background:var(--solid);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)' : 'background:transparent;color:var(--muted)')
}));
return { themeClass: theme === 'light' ? 'm-light' : 'm-dark', tasks, filters, countLabel: tasks.length + (tasks.length === 1 ? ' task' : ' tasks') };
}
}
</script>
</body>
</html>
