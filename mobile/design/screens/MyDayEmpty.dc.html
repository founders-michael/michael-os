<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Day, empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button{font:inherit}
.m a{color:inherit;text-decoration:none}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--bar:#0A0E13;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--atext:#6AF5C4;--fill:#41F0B0;--onfill:#03140D;--orb:radial-gradient(circle at 34% 28%,#E6FFF5 0%,#7DFAD0 16%,#41F0B0 34%,#0F9E76 58%,#04261D 86%);--orbglow:0 0 22px rgba(65,240,176,.5);--ring:rgba(65,240,176,.3)}
.m-light{--paint:#F5F7FA;--bar:#FFFFFF;--raise:#FFFFFF;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--atext:#047857;--fill:#0B1220;--onfill:#FFFFFF;--orb:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#C9F7E4 22%,#34D399 52%,#047857 92%);--orbglow:0 8px 20px rgba(16,185,129,.28);--ring:rgba(52,211,153,.45)}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden">
<main style="flex: 1; min-height: 0; padding: 20px 16px 0; display: flex; flex-direction: column; overflow: hidden">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--faint)">Monday 16 November</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08">Good morning, Gautam</h1>
</div>
<a href="Settings.dc.html" aria-label="Account and settings" style="width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--border2); font-weight: 600; font-size: 15px">G</a>
</header>

<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 0 12px 40px">
<div aria-hidden="true" style="position: relative; width: 120px; height: 120px; display: grid; place-items: center"><span style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--ring)"></span><span style="width: 64px; height: 64px; border-radius: 50%; background: var(--orb); box-shadow: var(--orbglow)"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em">Nothing planned for today</h2>
<p style="margin: 0; font-size: 15px; color: var(--muted)">Add what's on your mind and Michael will help you fit it into the day.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px">
<a href="TaskEditor.dc.html" style="height: 52px; border-radius: 14px; background: var(--fill); color: var(--onfill); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center">Add a task</a>
<a href="Michael.dc.html" style="height: 48px; border-radius: 14px; border: 1px solid var(--border2); background: var(--raise); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Tell Michael about your day</a>
</div>
</div>
</main>

<nav aria-label="Tabs" style="height: 64px; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border-top: 1px solid var(--border); background: var(--bar)">
<a href="Main.dc.html" aria-current="page" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--atext)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>My Day</a>
<a href="Tasks.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Tasks</a>
<a href="Michael.dc.html" aria-label="Michael" style="height: 64px; display: grid; place-items: center"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: var(--orb); box-shadow: var(--orbglow)"></span></a>
<a href="Calendar.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Calendar</a>
<a href="More.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--faint)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark' };
}
}
</script>
</body>
</html>
