<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button,.m textarea{font:inherit}
.m a{color:inherit;text-decoration:none}
.m textarea::placeholder{color:var(--faint)}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--surface:rgba(255,255,255,.028);--solid:#0C1117;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--atext:#6AF5C4;--warn:#FFC27A;--warnbg:rgba(255,194,122,.10);--shadow:none}
.m-light{--paint:#F5F7FA;--surface:#FFFFFF;--solid:#FFFFFF;--raise:#F2F5F8;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--atext:#047857;--warn:#9A5B00;--warnbg:#FFF7E8;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 16px 16px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="More.dc.html" style="height: 44px; margin-left: -8px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
<span role="status" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--atext)"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Saved</span>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--faint)">Daily Review</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1">Monday 16 Nov</h1>
</div>
<div style="display: flex; gap: 6px">
<button aria-label="Previous day" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border2); background: var(--raise); color: var(--text); display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Next day" disabled style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--faint); display: grid; place-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<div style="padding: 12px; border-radius: 14px; background: var(--raise); border: 1px solid var(--border)"><div style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600">7</div><div style="font-size: 12px; color: var(--muted)">Planned</div></div>
<div style="padding: 12px; border-radius: 14px; background: var(--raise); border: 1px solid var(--border)"><div style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600; color: var(--atext)">5</div><div style="font-size: 12px; color: var(--muted)">Completed</div></div>
<div style="padding: 12px; border-radius: 14px; background: var(--raise); border: 1px solid var(--border)"><div style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600">2</div><div style="font-size: 12px; color: var(--muted)">Missed</div></div>
</div>

<h2 style="margin: 20px 4px 8px; font-size: 17px; font-weight: 600; letter-spacing: -.02em">Missed</h2>
<div style="border-radius: 18px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); overflow: hidden">
<div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border)">
<span style="font-size: 15px; font-weight: 500">Send the investor update</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border2); background: var(--raise); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer">Move to tomorrow</button>
<button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border2); background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer">Pick a date</button>
<button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer">Skipped on purpose</button>
</div>
</div>
<div style="padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 15px; font-weight: 500; color: var(--muted)">Renew the domain</span>
<span style="height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: var(--warnbg); color: var(--warn); font-size: 12px; font-weight: 500">Moved to Tue 17</span>
</div>
</div>

<h2 style="margin: 20px 4px 8px; font-size: 17px; font-weight: 600; letter-spacing: -.02em">Reflection</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="well" style="font-size: 13px; font-weight: 500; color: var(--muted)">What went well</label>
<textarea id="well" rows="2" style="padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-size: 15px; line-height: 1.45; resize: none">Finished the mobile plan in one sitting. The morning walk helped.</textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="hard" style="font-size: 13px; font-weight: 500; color: var(--muted)">What was hard</label>
<textarea id="hard" rows="2" placeholder="Anything that got in the way" style="padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-size: 15px; line-height: 1.45; resize: none"></textarea>
</div>
<p style="margin: 0; font-size: 13px; color: var(--faint); padding: 0 4px">Blockers, lessons and improvements follow below. Everything saves as you type.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark' };
}
}
</script>
</body>
</html>
