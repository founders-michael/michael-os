<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, wake and bedtime</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.m button{font:inherit}
.m-dark{--paint:radial-gradient(520px 300px at 80% -8%,rgba(65,240,176,.13),transparent 62%),#06080B;--solid:#0C1117;--raise:rgba(255,255,255,.05);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#ECF2F5;--muted:#9AA7B2;--faint:#808D99;--accent:#41F0B0;--accent2:#5CD6FF;--fill:#41F0B0;--onfill:#03140D;--track:rgba(255,255,255,.07);--night:rgba(92,214,255,.16)}
.m-light{--paint:#F5F7FA;--solid:#FFFFFF;--raise:#F2F5F8;--border:#E3E8EE;--border2:#D2D9E2;--text:#0B1220;--muted:#526071;--faint:#5F6B7B;--accent:#10B981;--accent2:#3B82F6;--fill:#0B1220;--onfill:#FFFFFF;--track:#E8EDF2;--night:#DBEAFE}
</style>
</helmet>
<div class="m {{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--paint); color: var(--text); overflow: hidden; padding: 8px 20px 20px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<button aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" style="flex: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden"><div style="width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2))"></div></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: var(--muted)">2 / 5</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1">When does your day start and end?</h1>
<p style="margin: 0; font-size: 15px; color: var(--muted)">Michael never plans anything, or reminds you of anything, while you're asleep.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="l-wake" style="font-size: 13px; font-weight: 500; color: var(--muted)">Wake up</span>
<button aria-labelledby="l-wake" style="height: 64px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600; text-align: left; cursor: pointer">07:00</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="l-bed" style="font-size: 13px; font-weight: 500; color: var(--muted)">Bedtime</span>
<button aria-labelledby="l-bed" style="height: 64px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border2); background: var(--solid); color: var(--text); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600; text-align: left; cursor: pointer">22:30</button>
</div>
</div>

<div role="img" aria-label="Your day: awake from 07:00 to 22:30, 15 and a half hours" style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 14px; border-radius: 999px; background: var(--night); position: relative; overflow: hidden"><div style="position: absolute; left: 29.2%; width: 64.6%; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2))"></div></div>
<div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--faint)"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
<span style="font-size: 14px; color: var(--muted)">Awake for 15 h 30 min</span>
</div>

<div style="flex: 1"></div>
<button style="height: 52px; border-radius: 14px; border: 0; background: var(--fill); color: var(--onfill); font-weight: 600; font-size: 16px; cursor: pointer">Continue</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'm-light' : 'm-dark' };
}
}
</script>
</body>
</html>
