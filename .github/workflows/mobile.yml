name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    env:
      SWIFTLINT_VERSION: 0.65.1
      DESTINATION: platform=iOS Simulator,OS=26.5,name=iPhone 17
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Install SwiftLint
        run: |
          curl -sSfL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint and format
        run: scripts/lint.sh

      - name: Module boundaries
        run: scripts/check-module-boundaries.sh

      - name: Build and test (Debug)
        run: xcodebuild test -workspace MichaelOS.xcworkspace -scheme MichaelOS -destination "$DESTINATION" -quiet

      - name: Build (Release)
        run: xcodebuild build -workspace MichaelOS.xcworkspace -scheme MichaelOS -configuration Release -destination "generic/platform=iOS Simulator" -quiet

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # build = compile (warnings are errors), Android Lint, unit tests, detekt, ktlint and the token check.
      - name: Build, lint and test
        run: ./gradlew build --console=plain
